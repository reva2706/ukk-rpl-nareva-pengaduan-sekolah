name: sarana_pengaduan_sekolah
description: "Aplikasi Aspirasi Siswa SMKN 1 Sanden"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase & Database
  firebase_core: ^3.1.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.1
  
  # Fitur Foto / Galeri & Kamera
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  
  # Fitur Multimedia (Audio & Video)
  audioplayers: ^6.0.0
  video_player: ^2.8.6
  path_provider: ^2.1.4
  internet_connection_checker_plus: ^2.7.2

  # Grafik Dashboard per NIS
  fl_chart: ^0.68.0
  
  # Fitur Notifikasi HP
  flutter_local_notifications: ^17.2.2
  flutter_local_notifications_linux: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo_bg.png
    - assets/profil_sekolah.mp4
    - assets/video_ikan.mp4
    - assets/sekolah.png
    - assets/logo_sekolah.png
    - assets/notif.mp3