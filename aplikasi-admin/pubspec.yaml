# ==================== NAMA PROJECT ====================
# Fungsi: Bagian nama project.
name: admin_aspirasi_web
# ==================== DESKRIPSI PROJECT ====================
# Fungsi: Bagian deskripsi project.
description: Portal Admin Pengaduan Aspirasi SMKN 1 Sanden - Developed by Nareva Ranov P
publish_to: 'none'

# ==================== VERSI APLIKASI ====================
# Fungsi: Bagian versi aplikasi.
version: 1.0.0+1

# ==================== VERSI SDK ====================
# Fungsi: Bagian versi sdk.
environment:
  sdk: '>=3.0.0 <4.0.0'

# ==================== DEPENDENCIES / PACKAGE ====================
# Fungsi: Bagian dependencies / package.
dependencies:
# ==================== KONFIGURASI FLUTTER ====================
# Fungsi: Bagian konfigurasi flutter.
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
# ==================== FIREBASE / DATABASE ====================
# Fungsi: Bagian firebase / database.
  # Firebase Packages (Kompatibel penuh dengan Flutter Web & GitHub Actions)
# ==================== FIREBASE / DATABASE ====================
# Fungsi: Bagian firebase / database.
  firebase_core: ^3.6.0
# ==================== FIREBASE / DATABASE ====================
# Fungsi: Bagian firebase / database.
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
# ==================== FIREBASE / DATABASE ====================
# Fungsi: Bagian firebase / database.
  firebase_storage: ^12.3.4
# ==================== FIREBASE / DATABASE ====================
# Fungsi: Bagian firebase / database.
  firebase_messaging: ^15.1.3 # <--- TAMBAHAN UNTUK FITUR NOTIFIKASI ADMIN

# ==================== DEV DEPENDENCIES ====================
# Fungsi: Bagian dev dependencies.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# ==================== KONFIGURASI FLUTTER ====================
# Fungsi: Bagian konfigurasi flutter.
flutter:
# ==================== MATERIAL DESIGN ====================
# Fungsi: Bagian material design.
  uses-material-design: true

  # MENAMBAHKAN ASSETS
# ==================== ASSETS / GAMBAR ====================
# Fungsi: Bagian assets / gambar.
  assets:
    - assets/logo_sekolahbg.png
